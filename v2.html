ners.includes(n))s.owners[10]=n;render()}function note(t){s.log.unshift(t)}function act(cost,fn){if(!s.ap||s.gold<cost)return alert('행동력 또는 군자금 부족');s.ap--;s.gold-=cost;fn();render()}const links=[[1,2,10,17],[0,4,6,19],[0,15,18],[7,12,14],[1,5,17,19],[4,19],[1,12,16,17],[3,13,14,15],[9,13,14],[8,18],[0,11,15,17],[10,12,16],[3,6,11],[7,8,18],[3,7,8],[2,7,10,18],[6,11,17],[0,4,6,10,16],[2,9,13,15],[1,4,5]];const traits={'조조':[.78,1.15],'유비':[.35,1.02],'동탁':[.85,1.12],'손견':[.72,1.1],'원소':[.55,1.05],'공손찬':[.65,1.05]};const life={'조조':[155,220],'유비':[161,223],'관우':[null,220],'장비':[null,221],'여포':[null,199],'동탁':[null,192],'손견':[155,191],'원소':[null,202],'조운':[null,229],'제갈량':[181,234],'주유':[175,210],'사마의':[179,251],'손권':[182,252],'곽가':[170,207],'하후돈':[null,220],'하후연':[null,219],'장료':[169,222],'순욱':[163,212],'공손찬':[null,199],'도겸':[132,194],'유표':[142,208],'유언':[null,194],'마등':[null,212],'왕윤':[137,192],'화웅':[null,191]};function diplomacyInit(){s.dead=s.dead||[];s.pacts=s.pacts||{};s.trust=s.trust||{};s.succession=s.succession||{};}function pair(a,b){return [a,b].sort().join('|')}function allied(a,b){return !!s.pacts?.[pair(a,b)]}function dip(i,k){diplomacyInit();let f=s.dipList[i];if(!f||!s.owners.includes(f))return;let p=pair(s.f,f);if(k==='동맹'&&allied(s.f,f))return;act(k==='동맹'?1000:0,()=>{if(k==='동맹'){if((s.trust[p]||0)>=20||Math.random()<.45){s.pacts[p]=true;note(f+'군과 동맹 체결')}else note(f+'군이 동맹을 거절했다')}else if(k==='친선'){s.trust[p]=(s.trust[p]||0)+20;note(f+'군과 관계 개선')}else if(allied(s.f,f)){delete s.pacts[p];s.trust[p]=-60;note(f+'군과 동맹 파기 · 신뢰 하락')}})}function diplomacy(){diplomacyInit();s.dipList=[...new Set(s.owners)].filter(f=>f!==s.f&&f!=='재야');return '<h2>외교 · 제후 관계</h2>'+s.dipList.map((f,i)=>'<section><b>'+esc(f)+'군</b><p>'+(allied(s.f,f)?'동맹':'독립 세력')+' · 신뢰 '+(s.trust[pair(s.f,f)]||0)+'</p><button onclick="dip('+i+',\'친선\')">친선</button><button onclick="dip('+i+',\'동맹\')">동맹 제안</button><button onclick="dip('+i+',\'파기\')">동맹 파기</button></section>').join('')}function mortality(){diplomacyInit();if(s.month!==1)return;for(let n of [...new Set([...s.people,...s.owners])]){let d=life[n]?.[1];if(!d||s.year<d||s.dead.includes(n)||n===s.n)continue;if(Math.random()>(s.year===d?.65:.25))continue;s.dead.push(n);s.people=s.people.filter(x=>x!==n);note(n+' 사망 · 역사적 사망 연도 '+d+'년');if(s.owners.includes(n)){let heir=({'조조':'조비','유비':'유선','손견':'손책','손책':'손권','원소':'원상','동탁':'이각','유표':'유종','유언':'유장'}[n])||n+' 후계군';s.owners=s.owners.map(x=>x===n?heir:x);s.succession[n]=heir;note(heir+' 세력 계승');if(s.f===n)s.f=heir;}}}function lifeLabel(n){let a=life[n];return a?'<small>출생 '+(a[0]||'미상')+' · 역사상 사망 '+a[1]+'년</small>':''}function aiDiplomacy(){diplomacyInit();let fs=[...new Set(s.owners)].filter(n=>n!=='재야'&&n!==s.f);for(let f of fs){let other=fs.find(x=>x!==f);if(!other)continue;let p=pair(f,other);if(s.pacts[p]&&Math.random()<.025){delete s.pacts[p];note(f+'군과 '+other+'군 동맹 파기')}else if(!s.pacts[p]&&Math.random()<.035){s.pacts[p]=true;note(f+'군과 '+other+'군 동맹 체결')}let q=pair(f,s.f);if(s.pacts[q]&&Math.random()<.02){delete s.pacts[q];s.trust[q]=-60;note(f+'군이 아군과의 동맹을 파기했다')}}} function aiTurn(){diplomacyInit();aiDiplomacy();s.ai=s.ai||{};let fs=[...new Set(s.owners)].filter(n=>n!==s.f&&n!=='재야');for(let f of fs){let own=s.owners.map((n,i)=>n===f?i:-1).filter(i=>i>=0);if(!own.length)continue;let a=s.ai[f]||(s.ai[f]={gold:6000,food:15000,troops:6000,morale:75});let [agg,power]=traits[f]||[.48,1];a.gold+=own.length*650;a.food+=own.length*1000;a.troops+=Math.min(own.length*450,Math.floor(a.gold/3));a.gold=Math.max(0,a.gold-own.length*300);a.morale=Math.min(100,a.morale+3);let targets=[...new Set(own.flatMap(i=>links[i]))].filter(i=>s.owners[i]!==f&&!allied(f,s.owners[i]));if(!targets.length||a.gold<1000||a.food<1000||Math.random()>agg){note(f+'군 · 내정 및 병력 정비');continue}let i=targets.sort((x,y)=>(s.owners[x]==='재야'?-1:0)-(s.owners[y]==='재야'?-1:0))[0],enemy=s.owners[i],def=enemy===s.f?s.troops:enemy==='재야'?2500:(s.ai[enemy]?.troops||6000);a.gold-=1000;a.food-=1000;let win=a.troops*power*(.7+Math.random()*.6)>def*(.8+Math.random()*.5);a.troops=Math.max(500,a.troops-(win?700:1500));if(enemy===s.f)s.troops=Math.max(0,s.troops-(win?1500:500));else if(s.ai[enemy])s.ai[enemy].troops=Math.max(500,s.ai[enemy].troops-(win?1500:500));if(win){s.owners[i]=f;note('⚔ '+f+'군 → '+cities[i]+' 점령 ('+enemy+')')}else note('⚔ '+f+'군 → '+cities[i]+' 공격 실패')}if(s.role==='군주'&&!s.owners.includes(s.f)){s.role='장수';s.f='재야';note('세력 멸망 · 재야 장수로 전환')}} function next(){if(++s.month>12){s.month=1;s.year++}s.ap=3;s.gold+=800+500*s.owners.filter(x=>x===s.f).length;s.food=Math.max(0,s.food+1800-Math.floor(s.troops/10));for(let [n,y] of [['주유',195],['곽가',196],['대교',199],['소교',199],['견희',200],['제갈량',207],['황월영',207],['손상향',208],['사마의',208]])if(s.year>=y&&!s.people.includes(n)){s.people.push(n);note(n+' 등장')}mortality();aiTurn();render()}const dialogue={"조조":["천하를 얻는 것보다 사람의 마음을 얻는 일이 어렵더군.","그대 앞에서는 나도 잠시 천하를 잊어도 되겠는가?"],"유비":["백성이 편안해야 우리도 편안할 수 있소.","그대와 함께라면 초가삼간도 궁궐보다 좋겠소."],"관우":["의리를 저버리는 자와는 함께할 수 없소.","내 검은 의리를 위해, 내 마음은 그대를 위해 지키겠소."],"장비":["허허! 술 한 잔 하겠소?","그대가 웃으니 나도 기분이 좋구려!"],"여포":["천하에 내 창을 당할 자가 있겠는가?","전장에서는 두려운 것이 없는데, 그대의 침묵은 두렵군."],"조운":["위험한 곳에는 제가 먼저 가겠습니다.","오늘만큼은 호위가 아니라 그대 곁의 한 사람이고 싶습니다."],"초선":["춤 한 자락에 세상의 근심을 잊으실 수 있을까요?","오늘은 누구의 뜻도 아닌 제 마음으로 곁에 있고 싶어요."],"제갈량":["천하의 형세는 바람처럼 변하는 법이지요.","그대의 마음만은 제 계책으로도 헤아릴 수 없군요."],"주유":["오늘 밤에는 금을 연주해 볼까 하오.","그대를 위해 만든 곡이오. 제목은 아직 정하지 못했소."],"손상향":["활쏘기 시합이라도 하겠어요?","내가 먼저 손을 잡았다고 놀리지는 마세요."],"황월영":["새로운 기물을 만들고 있어요. 함께 보시겠어요?","그대와 밤새 이야기를 나누어도 시간이 부족하네요."],"견희":["달빛이 참 고요하군요.","그대가 찾아오는 날이면 기다리는 시간마저 즐거워요."],"채문희":["시 한 수를 지었습니다. 들어보시겠어요?","그대에게만 들려드리고 싶은 노래가 있어요."],"동탁":["난세에는 힘이 곧 권세다.","내 앞에서 거리낌 없이 웃는 사람은 그대뿐이군."],"원소":["명문가의 이름에는 책임이 따르는 법이오.","가문의 체면보다 그대의 마음이 궁금해지는군."],"하후돈":["전장에서는 한 치의 방심도 허용되지 않소.","그대 곁에서는 갑옷을 벗고 쉬고 싶소."],"장료":["군율을 지켜야 승리를 얻을 수 있소.","돌아올 곳이 있다는 것이 이토록 든든할 줄 몰랐소."],"대교":["차를 준비했어요. 잠시 쉬어 가세요.","그대와 보내는 평범한 오후가 가장 소중해요."],"소교":["오늘은 무슨 재미있는 이야기를 가져오셨나요?","조금만 더 있다 가시면 안 돼요?"]};function illustrated(n){return !!((oldArtReady&&crops[n])||(artReady&&newCrops[n]))}function rel(i,t){let n=s.people[i];if(!illustrated(n)||s.dead?.includes(n))return;act(t==='선물'?500:0,()=>{let r=s.rel[n]||0,romance=women.includes(n)!==s.female,lines=dialogue[n]||['난세에 뜻을 함께할 벗을 만나 반갑소.','그대와 함께하는 시간이 기다려지는군.'];if(t==='혼인'){if(r>=85&&!s.spouse&&romance){s.spouse=n;s.chat={n,line:'앞으로는 기쁨도 슬픔도 함께 나누고 싶소.',reply:'혼인을 받아들였다.'};note(n+'과 혼인했다')}else s.chat={n,line:'아직은 혼인을 약속할 때가 아니오.',reply:'혼인 조건: 호감도 85 이상, 미혼'}}else{s.rel[n]=Math.min(100,r+(t==='선물'?15:10));s.chat={n,line:t==='선물'?'이 귀한 선물을 나에게? 고맙소.':s.spouse===n?'오늘은 내 곁에서 조금 더 쉬어 가오.':lines[romance&&r>=40?1:0],reply:'호감도 '+s.rel[n]+' / 100'};note(n+'과 교류했다')}})}function chatPanel(){if(!s.chat)return '';return '<section class="chat"><div class="face">'+portrait(s.chat.n)+'</div><b>'+esc(s.chat.n)+'</b><p>“'+esc(s.chat.line)+'”</p><small>'+esc(s.chat.reply)+'</small><button onclick="s.chat=null;render()">닫기</button></section>'}function attack(i){if(allied(s.f,s.owners[i]))return alert('동맹군입니다. 먼저 동맹을 파기하세요');if(s.role!=='군주')return alert('군주만 출진 가능');if(!s.owners.some((n,j)=>n===s.f&&links[j].includes(i)))return alert('인접 영토만 공격할 수 있습니다');act(1000,()=>{if(s.troops*(.65+(stats[s.n]?.[0]||70)/200+Math.random()*.35)>5000+Math.random()*5000){s.owners[i]=s.f;s.troops=Math.max(0,s.troops-1000);note(cities[i]+' 점령')}else{s.troops=Math.max(0,s.troops-1800);note('공성 실패')}})}function save(){localStorage.setItem('lotus2',JSON.stringify(s));alert('저장 완료')}function load(){try{s=JSON.parse(localStorage.getItem('lotus2'));if(!s)throw 0;render()}catch(e){alert('저장 없음')}}function worldMap(){let pts=[[59,36],[75,23],[43,40],[65,76],[62,22],[82,10],[81,45],[49,59],[23,67],[14,23],[59,48],[75,57],[89,67],[29,48],[49,72],[43,49],[79,38],[65,31],[30,32],[72,13]],colors=['#486fa4','#4c986e','#a74448','#d49b48','#8865a5','#5d9fa0','#b66d88','#8d7950','#657b4a','#a26a44','#999080'];let factions=[...new Set(owners.filter(x=>x!=='재야'))];function color(n){return n==='재야'?'#9c9480':n===s.f?'#d8b34e':colors[Math.max(0,factions.indexOf(n))%colors.length]}let land=[[8,20],[24,8],[43,11],[55,5],[76,5],[91,13],[95,28],[88,39],[94,51],[98,65],[85,83],[65,91],[46,87],[29,91],[12,77],[6,53]];function cell(i){let poly=land.slice(),a=pts[i];for(let j=0;j<pts.length;j++){if(j===i)continue;let b=pts[j],dx=b[0]-a[0],dy=b[1]-a[1],mid=[(a[0]+b[0])/2,(a[1]+b[1])/2],d=p=>(p[0]-mid[0])*dx+(p[1]-mid[1])*dy;let out=[];for(let k=0;k<poly.length;k++){let p=poly[k],q=poly[(k+1)%poly.length],u=d(p),v=d(q);if(u<=0)out.push(p);if((u<=0)!==(v<=0)){let t=u/(u-v);out.push([p[0]+t*(q[0]-p[0]),p[1]+t*(q[1]-p[1])])}}poly=out}return poly.map(p=>p.map(v=>v*6).join(',')).join(' ')}let count=s.owners.filter(x=>x===s.f).length;return '<h2>天下 · 군웅할거</h2><p>보유 영토 '+count+' / '+cities.length+' · 천하통일 '+Math.round(count/cities.length*100)+'%</p><progress max="'+cities.length+'" value="'+count+'"></progress><svg class="worldmap" viewBox="0 0 600 570"><rect width="600" height="570" fill="#233e4b"/>'+pts.map((p,i)=>'<polygon points="'+cell(i)+'" fill="'+color(s.owners[i])+'" stroke="#e6d2a2" stroke-width="2" onclick="selectCity('+i+')"/>').join('')+'<path d="M65 180 Q130 120 200 190 T350 180 T510 190 M80 380 Q160 340 230 410 T390 390 T550 400" stroke="#a6d4e4" stroke-width="5" fill="none" opacity=".8" pointer-events="none"/>'+pts.map((p,i)=>'<g onclick="selectCity('+i+')"><circle cx="'+p[0]*6+'" cy="'+p[1]*6+'" r="5" fill="#fff0c4" stroke="#33241c"/><text x="'+p[0]*6+'" y="'+(p[1]*6+16)+'" text-anchor="middle" font-size="13" fill="white" stroke="#35271d" stroke-width="3" paint-order="stroke">'+cities[i]+'</text></g>').join('')+'</svg><small>후한 말 주요 도시 위치를 단순화한 게임용 지도</small><div class="legend">'+[...new Set(s.owners)].map(n=>'<span style="color:'+color(n)+'">■ '+esc(n)+'</span>').join(' ')+'</div><div id="citydetail">영토를 눌러 상세 정보를 확인하세요.</div>'}function selectCity(i){document.getElementById('citydetail').innerHTML='<h2>🏯 '+cities[i]+'</h2><p>현재 세력: '+esc(s.owners[i])+'</p>'+(s.owners[i]===s.f?'아군 영토':'<button onclick="attack('+i+')">⚔ 출진 · 군자금 1,000</button>')} function render(){historical();document.body.classList.remove('landing');if(s.owners.length===cities.length&&s.owners.every(o=>o===s.f)&&s.f!=='재야'&&!s.endingSeen){victory();return;}app.innerHTML='<section class="status"><div class="playerArt">'+portrait(s.n)+'</div><b>'+s.year+'년 '+s.month+'월</b><p>💰 '+s.gold+'　🌾 '+s.food+'　⚔ '+s.troops+'　행동 '+s.ap+'/3</p><h2>'+esc(s.n)+'</h2>'+esc(s.f)+' · '+s.role+' · 관직 '+s.rank+' · 혼인 '+esc(s.spouse||'미혼')+'<p><button onclick="next()">다음 달</button><button onclick="save()">저장</button><button onclick="menu()">메뉴</button></p></section>'+['내정','천하','인물','외교','출세'].map(t=>'<button class="navBtn '+(tab===t?'active':'')+'" onclick="tab=\''+t+'\';render()">'+({'내정':'🏯','천하':'⚔','인물':'♡','출세':'📜','외교':'🤝'}[t])+' '+t+'</button>').join('')+'</nav><section id="content"></section><section>'+s.log.slice(0,25).map(esc).join('<br>')+'</section>';let h='';if(tab==='내정')h='<button onclick="act(500,()=>{s.food+=3000;note(\'농업 개발\')})">농업</button><button onclick="act(500,()=>{s.gold+=1500;note(\'상업 개발\')})">상업</button><button onclick="act(800,()=>{s.troops+=1800;note(\'징병 완료\')})">징병</button>';if(tab==='천하')h=worldMap();if(tab==='인물')h=chatPanel()+'<small>인물 열전</small><div class="grid">'+s.people.map((n,i)=>n===s.n||!illustrated(n)||s.dead?.includes(n)?'':'<section><div class="face">'+portrait(n)+'</div><b>'+n+'</b><p>호감 '+(s.rel[n]||0)+'</p>'+['대화','선물','혼인'].map(t=>'<button onclick="rel('+i+',\''+t+'\')">'+t+'</button>').join('')+'</section>').join('')+'</div>';if(tab==='외교')h=diplomacy();if(tab==='출세')h='<button onclick="act(500,()=>{s.rank++;note(\'승진\')})">공적 쌓기</button><button onclick="independent()">독립</button>';document.getElementById('content').innerHTML=eventPanel()+'<div class="scene scene-'+({'내정':'court','천하':'war','인물':'garden','출세':'court'}[tab]||'court')+'"></div>'+h;localStorage.setItem('lotus2',JSON.stringify(s))}function victory(){s.unified=true;localStorage.setItem('lotus',JSON.stringify(s));app.innerHTML='<section class="victory"><img src="cover.jpg" alt="난세의 연화"><small>天下統一 · THE END</small><h2>천하통일</h2><p>'+esc(s.n)+'의 이름 아래 천하가 하나로 통일되었습니다.</p><p>통일 연도 '+s.year+'년 '+s.month+'월<br>점령 영토 '+cities.length+' / '+cities.length+'<br>최종 병력 '+s.troops+'<br>배우자 '+esc(s.spouse||'없음')+'</p><button class="primary" onclick="continueVictory()">통일 이후 계속 플레이</button><button onclick="menu()">메인 메뉴 · 새 게임</button></section>'}function continueVictory(){s.endingSeen=true;render()}function independent(){if(s.rank<3)return alert('관직 3 이상 필요');act(2000,()=>{s.role='군주';s.f=s.n;let i=s.owners.indexOf('재야');s.owners[i<0?10:i]=s.n;note('독립 세력 창설')})}menu();</script></html>
