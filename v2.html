nel(){deepInit();return '<h2>가문과 권력</h2><p>명성 '+s.reputation+' · 암투 위험 '+s.intrigue+'</p><section><h3>휘하 장수</h3>'+Object.keys(s.retinue).map(n=>'<p>'+esc(n)+' · 충성 '+s.retinue[n]+' <button onclick="reward('+JSON.stringify(n).replace(/"/g,'&quot;')+')">포상</button></p>').join('')+'</section><section><h3>가문</h3><p>배우자 '+esc(s.spouse||'없음')+'</p>'+s.children.map(x=>'<p>'+esc(x.name)+' · '+Math.max(0,s.year-x.born)+'세 · 교육 '+x.education+'</p>').join('')+(s.expecting?'<p>출산까지 '+s.expecting+'개월</p>':'')+'<button onclick="familyAction(0)">자녀 계획</button><button onclick="familyAction(1)">자녀 교육</button></section><section><h3>권력 암투</h3><button onclick="plot(0)">모반 조사</button><button onclick="plot(1)">첩자 파견</button></section><section><h3>나의 결말</h3>'+['황제 즉위','혼인 엔딩','은거','세력 멸망'].map(k=>'<button onclick="finish('+JSON.stringify(k).replace(/"/g,'&quot;')+')">'+k+'</button>').join('')+'</section>'}function tactics(i){if(s.owners[i]===s.f)return;document.getElementById('citydetail').innerHTML='<h2>'+cities[i]+' 공략</h2><p>적군 병력 약 '+(s.ai?.[s.owners[i]]?.troops||5000)+'</p><button onclick="attack('+i+',0)">정면 돌파 · 균형</button><button onclick="attack('+i+',1)">기습 · 고위험 고수익</button><button onclick="attack('+i+',2)">화공 · 군량 800</button><button onclick="attack('+i+',3)">신중한 공성 · 손실 감소</button>'} function attack(i,t=0){deepInit();if(s.owners[i]===s.f)return;if(t===2&&s.food<800)return alert('군량 부족');if(allied(s.f,s.owners[i]))return alert('동맹군입니다. 먼저 동맹을 파기하세요');if(s.role!=='군주')return alert('군주만 출진 가능');if(!s.owners.some((n,j)=>n===s.f&&links[j].includes(i)))return alert('인접 영토만 공격할 수 있습니다');act(1000,()=>{let before=s.troops,enemy=s.owners[i];if(t===2)s.food-=800;let bonus=Object.keys(s.retinue).reduce((a,n)=>a+(stats[n]?.[0]||65)*s.retinue[n]/100,0)/400;let factor=[1,.65+Math.random()*.9,1.25,.88][t];if(s.troops*(.65+(stats[s.n]?.[0]||70)/200+Math.random()*.35+bonus)*factor>(s.ai?.[enemy]?.troops||5000)*(.8+Math.random()*.4)){s.owners[i]=s.f;s.troops=Math.max(0,s.troops-(t===3?500:1000));s.battle={city:cities[i],enemy,before,loss:before-s.troops,win:true};note(cities[i]+' 점령')}else{s.troops=Math.max(0,s.troops-(t===3?800:1800));s.battle={city:cities[i],enemy,before,loss:before-s.troops,win:false};note('공성 실패')}})}function save(){localStorage.setItem('lotus2',JSON.stringify(s));alert('저장 완료')}function load(){try{s=JSON.parse(localStorage.getItem('lotus2'));if(!s)throw 0;render()}catch(e){alert('저장 없음')}}const geo=[[114.45,34.7,"카이펑"],[116.43,37.16,"더저우·핑위안"],[112.6,34.72,"뤄양"],[112.98,28.2,"창사"],[114.6,36.3,"한단·린장"],[117.6,40,"탕산·쭌화 일대"],[117.18,34.26,"쉬저우"],[112.15,32,"샹양"],[104.07,30.67,"청두"],[103.83,36.06,"란저우 일대"],[113.85,34.04,"쉬창"],[116.78,32.57,"화이난·서우현"],[118.8,32.06,"난징"],[107.03,33.07,"한중"],[112.19,30.35,"징저우"],[112.53,33,"난양"],[117.97,34,"쉬저우·쑤이닝"],[115.03,35.76,"푸양"],[108.94,34.27,"시안"],[116.7,38.04,"창저우·난피"]];const project=(p)=>[(p[0]-98)*4,(43-p[1])*4.35];function zoomMap(d){let m=document.querySelector('.mapScroll .worldmap');if(!m)return;m.style.setProperty('width',Math.max(360,Math.min(1800,m.getBoundingClientRect().width+d))+'px','important')}function worldMap(){let pts=geo.map(p=>[(p[0]-98)*38+35,(42-p[1])*43+30]),fs=[...new Set(s.owners)],palette=['#963e37','#3f6850','#365b83','#80588b','#a36b35','#527e80','#735744'];let color=n=>n===s.f?'#b28a36':n==='재야'?'#827b68':palette[fs.indexOf(n)%palette.length];let land=[[100,40],[105,41],[109,41],[113,42],[117,42],[120,40],[119,39],[118,39],[119,37.5],[121,37.5],[122,36.8],[120,35],[120,33],[122,31],[121,29],[120,27],[118,25],[116,23],[113,22],[110,21],[108,22],[105,23],[102,24],[100,27],[101,30],[100,33],[99,36]];let pr=p=>[(p[0]-98)*38+35,(42-p[1])*43+30],line=a=>a.map(p=>pr(p).join(',')).join(' ');let count=s.owners.filter(n=>n===s.f).length;let svg='<svg class="worldmap" viewBox="0 0 1000 970"><defs><pattern id="paper" width="19" height="17" patternUnits="userSpaceOnUse"><path d="M1 2l5 1m6 9l4 -2" stroke="#8d734d" opacity=".12"/></pattern><radialGradient id="parchment"><stop stop-color="#f1e2b8"/><stop offset="1" stop-color="#bda477"/></radialGradient></defs><rect width="1000" height="970" fill="#607e80"/><polygon points="'+line(land)+'" fill="url(#parchment)" stroke="#554b37" stroke-width="4"/><polygon points="'+line(land)+'" fill="url(#paper)"/>';let mountains=[[103,35],[104,34],[105,34],[106,34],[107,34],[108,34],[109,34],[105,32],[106,32],[107,32],[104,28],[105,27],[106,27],[108,27],[109,26],[110,26],[111,25],[112,25],[113,25],[114,26],[115,27],[116,28],[117,29],[110,39],[111,39],[112,39]];svg+=mountains.map(p=>{let [x,y]=pr(p);return '<path d="M'+(x-15)+' '+(y+9)+'l15 -24 15 24 -9 -4 -6 4 -6 -4z" fill="#8d7954" stroke="#655b43" opacity=".65"/>'}).join('');svg+=[[[100,35],[103,36],[104,37],[106,39],[110,40],[111,38],[110,35],[112,34.8],[114,34.9],[116,35.5],[118,37],[119,37.5]],[[100,30],[103,29],[105,29],[107,30],[110,31],[112,30],[114,30.5],[116,30],[118,31],[120,32],[122,31.5]]].map(a=>'<polyline points="'+line(a)+'" stroke="#4d8391" stroke-width="5" fill="none"/>').join('');svg+=pts.map((p,i)=>links[i].filter(j=>j>i).map(j=>'<line x1="'+p[0]+'" y1="'+p[1]+'" x2="'+pts[j][0]+'" y2="'+pts[j][1]+'" stroke="#7d6546" stroke-dasharray="5 5" opacity=".55"/>').join('')).join('');let offsets=[[0,0],[32,-10],[-22,-10],[0,0],[-22,-28],[0,0],[40,-15],[-30,5],[0,0],[0,0],[15,28],[30,30],[0,0],[0,0],[0,0],[-40,-20],[55,35],[10,-35],[-15,0],[25,-25]];svg+=pts.map((p,i)=>{let x=p[0],y=p[1],a=x+offsets[i][0],b=y+offsets[i][1],col=color(s.owners[i]);return '<g onclick="selectCity('+i+')" style="cursor:pointer"><line x1="'+x+'" y1="'+y+'" x2="'+a+'" y2="'+b+'" stroke="#5e4b31"/><circle cx="'+x+'" cy="'+y+'" r="7" fill="'+col+'" stroke="#fff0c4" stroke-width="2"/><g transform="translate('+a+' '+b+')"><rect x="-39" y="-12" width="78" height="43" rx="5" fill="#f5e8c8" stroke="'+col+'" stroke-width="2"/><rect x="-39" y="-12" width="78" height="16" rx="3" fill="'+col+'"/><text y="0" text-anchor="middle" fill="white" font-size="13" font-weight="bold">'+cities[i]+'</text><text y="15" text-anchor="middle" fill="#392c1c" font-size="9">'+esc(geo[i][2])+'</text><text y="26" text-anchor="middle" fill="'+col+'" font-size="11" font-weight="bold">'+esc(s.owners[i])+'</text></g></g>'}).join('');svg+='<text x="875" y="850" fill="#e6e0c5" font-size="26" letter-spacing="8">東海</text><text x="80" y="75" fill="#f5e8c8" font-size="25">北 ↑</text></svg>';return '<h2>天下形勢圖</h2><p>보유 성곽 '+count+' / '+cities.length+'</p><div class="mapTools"><button onclick="zoomMap(-180)">−</button><button onclick="zoomMap(180)">＋</button><button onclick="document.querySelector(\'.worldmap\').style.setProperty(\'width\',\'100%\',\'important\')">전체 보기</button><small>밀어서 이동</small></div><div class="mapScroll">'+svg+'</div><small>지형과 도로는 게임용으로 단순화</small><div id="citydetail">성곽을 선택하세요.</div><div class="cityList">'+cities.map((n,i)=>'<button style="border-left:5px solid '+color(s.owners[i])+'" onclick="selectCity('+i+');document.getElementById(\'citydetail\').scrollIntoView({block:\'center\'})"><b>'+n+'</b>'+esc(geo[i][2])+' · '+esc(s.owners[i])+'</button>').join('')+'</div>'}function selectCity(i){document.getElementById('citydetail').innerHTML='<h2>🏯 '+cities[i]+'</h2><p>현재 지명: '+esc(geo[i][2])+'</p><p>현재 지배자: '+esc(s.owners[i])+'</p>'+(s.owners[i]===s.f?'아군 영토':'<button onclick="tactics('+i+')">⚔ 출진 · 군자금 1,000</button>')} function render(){deepInit();if(s.finalEnding){app.innerHTML=endingPanel();localStorage.setItem('lotus2',JSON.stringify(s));return}historical();document.body.classList.remove('landing');if(s.owners.length===cities.length&&s.owners.every(o=>o===s.f)&&s.f!=='재야'&&!s.endingSeen){victory();return;}app.innerHTML='<section class="status"><div class="playerArt">'+portrait(s.n)+'</div><b>'+s.year+'년 '+s.month+'월</b><p>💰 '+s.gold+'　🌾 '+s.food+'　⚔ '+s.troops+'　행동 '+s.ap+'/3</p><h2>'+esc(s.n)+'</h2>'+esc(s.f)+' · '+s.role+' · 관직 '+s.rank+' · 혼인 '+esc(s.spouse||'미혼')+'<p><button class="turnEnd" onclick="next()">턴 종료 ▶</button><button onclick="save()">저장</button><button onclick="menu()">메뉴</button></p></section>'+['내정','천하','인물','외교','출세','가문'].map(t=>'<button class="navBtn '+(tab===t?'active':'')+'" onclick="tab=\''+t+'\';render()">'+({'내정':'🏯','천하':'⚔','인물':'♡','출세':'📜','외교':'🤝','가문':'♛'}[t])+' '+t+'</button>').join('')+'</nav><section id="content"></section><section>'+s.log.slice(0,25).map(esc).join('<br>')+'</section>';let h='';if(tab==='내정')h='<button onclick="act(500,()=>{s.food+=3000;note(\'농업 개발\')})">농업</button><button onclick="act(500,()=>{s.gold+=1500;note(\'상업 개발\')})">상업</button><button onclick="act(800,()=>{s.troops+=1800;note(\'징병 완료\')})">징병</button>';if(tab==='천하')h=worldMap();if(tab==='인물')h=chatPanel()+'<small>인물 열전</small><div class="grid">'+s.people.map((n,i)=>n===s.n||!illustrated(n)||s.dead?.includes(n)?'':'<section><div class="face">'+portrait(n)+'</div><b>'+n+'</b><p>호감 '+(s.rel[n]||0)+'</p><small>'+(s.retinue[n]?'휘하 장수 · 충성 '+s.retinue[n]:s.rivals[n]?'경쟁 세력: '+esc(s.rivals[n]):'')+'</small>'+['대화','선물','혼인','등용'].map(t=>'<button onclick="rel('+i+',\''+t+'\')">'+t+'</button>').join('')+'</section>').join('')+'</div>';if(tab==='외교')h=diplomacy();if(tab==='가문')h=deepPanel();if(tab==='출세')h='<button onclick="act(500,()=>{s.rank++;note(\'승진\')})">공적 쌓기</button><button onclick="independent()">독립</button>';document.getElementById('content').innerHTML=battlePanel()+reportPanel()+eventPanel()+storyPanel()+'<div class="scene scene-'+({'내정':'court','천하':'war','인물':'garden','출세':'court'}[tab]||'court')+'"></div>'+h;localStorage.setItem('lotus2',JSON.stringify(s))}function victory(){s.unified=true;localStorage.setItem('lotus2',JSON.stringify(s));app.innerHTML='<section class="victory"><img src="cover.jpg" alt="난세의 연화"><small>天下統一 · THE END</small><h2>천하통일</h2><p>'+esc(s.n)+'의 이름 아래 천하가 하나로 통일되었습니다.</p><p>통일 연도 '+s.year+'년 '+s.month+'월<br>점령 영토 '+cities.length+' / '+cities.length+'<br>최종 병력 '+s.troops+'<br>배우자 '+esc(s.spouse||'없음')+'</p><button class="primary" onclick="continueVictory()">통일 이후 계속 플레이</button><button onclick="menu()">메인 메뉴 · 새 게임</button></section>'}function continueVictory(){s.endingSeen=true;render()}function independent(){if(s.rank<3)return alert('관직 3 이상 필요');act(2000,()=>{s.role='군주';s.f=s.n;let i=s.owners.indexOf('재야');s.owners[i<0?10:i]=s.n;note('독립 세력 창설')})}menu();</script></html>
