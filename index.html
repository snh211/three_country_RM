<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>삼국지 : 난세의 연화</title><style>body{background:#18131d;color:#f5dfbd;font:16px system-ui;margin:0}main{max-width:800px;margin:auto;padding:18px}h1,h2{color:#e8bb78}button,input,select{background:#382632;color:#ffe6bd;border:1px solid #a57b48;border-radius:8px;padding:12px;margin:4px}section{border:1px solid #856643;border-radius:12px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}.face{font-size:48px;text-align:center;background:linear-gradient(135deg,#594452,#25212e);padding:18px;border-radius:8px}small{color:#c8ae98}</style><main><h1>❀ 삼국지 : 난세의 연화</h1><p>천하를 얻을 것인가, 마음을 얻을 것인가.</p><div id="app"></div></main><script>
const names='조조 유비 관우 장비 여포 동탁 손견 원소 조운 공손찬 초선 채문희 변부인 순욱 하후돈 하후연 황개 정보 안량 문추 화웅 이유 장료 왕윤 미축 도겸 유표 유언 마등 한수'.split(' '),women=['초선','채문희','변부인','견희','대교','소교','손상향','황월영'],cities='진류 평원 낙양 장사 업 북평 서주 양양 성도 서량 허창 수춘 건업 한중 강릉 완 하비 복양 장안 남피'.split(' '),owners='조조 유비 동탁 손견 원소 공손찬 도겸 유표 유언 마등 재야 재야 재야 재야 재야 재야 재야 재야 동탁 원소'.split(' '),factions='조조 유비 유비 유비 동탁 동탁 손견 원소 공손찬 공손찬 동탁 재야 조조 재야 조조 조조 손견 손견 원소 원소 동탁 동탁 동탁 동탁 재야 도겸 유표 유언 마등 마등'.split(' ');let s,tab='내정';const app=document.getElementById('app'),esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function menu(){app.innerHTML='<section><h2>190년 · 반동탁 연합</h2><select id="hero">'+names.map(n=>'<option>'+n+'</option>').join('')+'<option>신무장</option></select><input id="custom" placeholder="신무장 이름"><select id="gender"><option>여성</option><option>남성</option></select><select id="role"><option>장수</option><option>군주</option></select><button onclick="start()">시작</button><button onclick="load()">이어하기</button></section>'}function start(){let n=document.getElementById('hero').value,custom=n==='신무장',role=document.getElementById('role').value;if(custom)n=document.getElementById('custom').value.trim()||'연화';let f=factions[names.indexOf(n)]||'재야';s={n,f:role==='군주'?n:f,role, female:custom?document.getElementById('gender').value==='여성':women.includes(n),year:190,month:1,gold:12000,food:35000,troops:8500,ap:3,rank:0,owners:[...owners],people:[...names],rel:{},spouse:'',log:['반동탁 연합 결성 소식이 퍼졌다.']};if(role==='군주'&&!s.owners.includes(n))s.owners[10]=n;render()}function note(t){s.log.unshift(t)}function act(cost,fn){if(!s.ap||s.gold<cost)return alert('행동력 또는 군자금 부족');s.ap--;s.gold-=cost;fn();render()}function next(){if(++s.month>12){s.month=1;s.year++}s.ap=3;s.gold+=800+500*s.owners.filter(x=>x===s.f).length;s.food=Math.max(0,s.food+1800-Math.floor(s.troops/10));for(let [n,y] of [['주유',195],['곽가',196],['대교',199],['소교',199],['견희',200],['제갈량',207],['황월영',207],['손상향',208],['사마의',208]])if(s.year>=y&&!s.people.includes(n)){s.people.push(n);note(n+' 등장')}let i=Math.floor(Math.random()*20),j=(i+1)%20;if(s.owners[i]!==s.f&&s.owners[j]!==s.f&&s.owners[i]!=='재야'){s.owners[j]=s.owners[i];note(s.owners[i]+'의 '+cities[j]+' 점령')}render()}function rel(i,t){let n=s.people[i];act(t==='선물'?500:0,()=>{let r=s.rel[n]||0;if(t==='혼인'){if(r>=70&&!s.spouse&&women.includes(n)!==s.female){s.spouse=n;note(n+'과 혼인했다')}else note('혼인 조건 미충족')}else{s.rel[n]=Math.min(100,r+(t==='선물'?20:10));note(n+'과 친밀도 상승')}})}function attack(i){if(s.role!=='군주')return alert('군주만 출진 가능');act(1000,()=>{if(s.troops*(.8+Math.random()*.5)>5000+Math.random()*5000){s.owners[i]=s.f;s.troops=Math.max(0,s.troops-1000);note(cities[i]+' 점령')}else{s.troops=Math.max(0,s.troops-1800);note('공성 실패')}})}function save(){localStorage.setItem('lotus',JSON.stringify(s));alert('저장 완료')}function load(){try{s=JSON.parse(localStorage.getItem('lotus'));if(!s)throw 0;render()}catch(e){alert('저장 없음')}}function render(){app.innerHTML='<section><b>'+s.year+'년 '+s.month+'월</b><p>💰 '+s.gold+'　🌾 '+s.food+'　⚔ '+s.troops+'　행동 '+s.ap+'/3</p><h2>'+esc(s.n)+'</h2>'+esc(s.f)+' · '+s.role+' · 관직 '+s.rank+' · 혼인 '+esc(s.spouse||'미혼')+'<p><button onclick="next()">다음 달</button><button onclick="save()">저장</button><button onclick="menu()">메뉴</button></p></section>'+['내정','천하','인물','출세'].map(t=>'<button onclick="tab=\''+t+'\';render()">'+t+'</button>').join('')+'<section id="content"></section><section>'+s.log.slice(0,10).map(esc).join('<br>')+'</section>';let h='';if(tab==='내정')h='<button onclick="act(500,()=>{s.food+=3000;note(\'농업 개발\')})">농업</button><button onclick="act(500,()=>{s.gold+=1500;note(\'상업 개발\')})">상업</button><button onclick="act(800,()=>{s.troops+=1800;note(\'징병 완료\')})">징병</button>';if(tab==='천하')h='<div class="grid">'+cities.map((n,i)=>'<section>'+n+'<br>'+esc(s.owners[i])+(s.owners[i]!==s.f?'<button onclick="attack('+i+')">출진</button>':'')+'</section>').join('')+'</div>';if(tab==='인물')h='<small>초상화는 임시 아이콘입니다.</small><div class="grid">'+s.people.map((n,i)=>n===s.n?'':'<section><div class="face">'+(women.includes(n)?'🌸':'⚔️')+'</div><b>'+n+'</b><p>호감 '+(s.rel[n]||0)+'</p>'+['대화','선물','혼인'].map(t=>'<button onclick="rel('+i+',\''+t+'\')">'+t+'</button>').join('')+'</section>').join('')+'</div>';if(tab==='출세')h='<button onclick="act(500,()=>{s.rank++;note(\'승진\')})">공적 쌓기</button><button onclick="independent()">독립</button>';document.getElementById('content').innerHTML=h;localStorage.setItem('lotus',JSON.stringify(s))}function independent(){if(s.rank<3)return alert('관직 3 이상 필요');act(2000,()=>{s.role='군주';s.f=s.n;let i=s.owners.indexOf('재야');s.owners[i<0?10:i]=s.n;note('독립 세력 창설')})}menu();</script></html>
